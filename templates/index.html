<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Downloader Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* الكارد */
.card {
    width: 90%;
    max-width: 420px;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
}

/* العنوان */
.title {
    text-align: center;
    font-size: 20px;
    margin-bottom: 20px;
}

/* مربع الرابط */
.input-box {
    background: #e5e7eb;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 15px;
}

.input-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
}

/* خيارات */
.options {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.option {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    background: #1e293b;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
}

.option.active {
    border-color: #22c55e;
}

/* زر */
button {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* الملفات */
.files {
    margin-top: 20px;
}

.file {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border-bottom: 1px solid #334155;
}
</style>

</head>
<body>

<div class="card">

<div class="title">🔥 Downloader Pro</div>

<form method="POST" action="/download">

<div class="input-box">
    <input type="text" name="url" placeholder="أدخل الرابط هنا..." required>
</div>

<!-- اختيار الصيغة -->
<div class="options">
    <div class="option active" onclick="selectFormat(this, 'mp4')">
        🎬 فيديو<br>MP4
    </div>
    <div class="option" onclick="selectFormat(this, 'mp3')">
        🎧 صوت<br>MP3
    </div>
</div>

<input type="hidden" name="format" id="format" value="mp4">

<button type="submit">تحميل</button>

</form>

<div class="files">
<h4>📂 الملفات:</h4>

{% for file in files %}
<div class="file">
    <a href="/files/{{file}}" style="color:white;">{{file}}</a>
</div>
{% endfor %}

</div>

</div>

<script>
function selectFormat(el, type) {
    document.querySelectorAll('.option').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('format').value = type;
}
</script>

</body>
</html>
