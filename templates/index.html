<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Downloader Pro</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 40px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
}

input, select {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 12px 30px;
    border: none;
    background: #22c55e;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

.file-box {
    background: #334155;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}
</style>

</head>
<body>

<div class="container">

<h2>🔥 Downloader Pro</h2>

<form method="POST" action="/download">
    <input type="text" name="url" placeholder="الصق الرابط هنا..." required>

    <select name="format">
        <option value="mp4">🎬 فيديو (MP4)</option>
        <option value="mp3">🎧 صوت (MP3)</option>
    </select>

    <br>
    <button type="submit">تحميل</button>
</form>

<hr>

<h3>📂 الملفات:</h3>

{% for file in files %}
<div class="file-box">
    <a href="/files/{{file}}" target="_blank" style="color:white;">{{file}}</a>
    <br>
    <a href="/delete/{{file}}" style="color:red;">حذف</a>
</div>
{% endfor %}

</div>

</body>
</html>
