<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloader Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    padding: 15px;
}

/* الكارد */
.card {
    width: 100%;
    max-width: 380px;
    background: rgba(15, 23, 42, 0.95);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
}

/* العنوان */
.title {
    text-align: center;
    font-size: 18px;
    margin-bottom: 15px;
}

/* مربع الرابط */
.input-box {
    background: #e5e7eb;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
}

.input-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
}

/* الخيارات */
.options {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.option {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    background: #1e293b;
    text-align: center;
    border: 2px solid #22c55e;
    font-size: 14px;
}

/* زر */
button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.02);
}

/* الملفات */
.files {
    margin-top: 15px;
    font-size: 14px;
}

.file {
    display: flex;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid #334155;
}

.file a {
    color: white;
    text-decoration: none;
}
</style>

</head>
<body>

<div class="card">

<div class="title">🔥 Downloader Pro</div>

<form method="POST" action="/download">

<div class="input-box">
    <input type="text" name="url" placeholder="أدخل الرابط هنا..." required>
</div>

<!-- خيار واحد فقط -->
<div class="options">
    <div class="option">
        🎬 تحميل فيديو (MP4)
    </div>
</div>

<button type="submit">تحميل</button>

</form>

<div class="files">
<h4>📂 الملفات:</h4>

{% for file in files %}
<div class="file">
    <a href="/files/{{file}}" target="_blank">{{file}}</a>
</div>
{% endfor %}

</div>

</div>

</body>
</html>
