<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PRO MAX - V7 | Maher Elite Engineering</title>
    <style>
        /* -----------------------------------------------------------
           1. الأساسيات والخطوط
           ----------------------------------------------------------- */
        :root {
            --primary-blue: #3a8dff;
            --primary-purple: #8a4fff;
            --accent-gold: #ffcf40;
            --text-main: #ffffff;
            --text-secondary: #b0b0b0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(15px);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: radial-gradient(circle at top left, #1a1a3a, #0d0d1a),
                        linear-gradient(135deg, #1e0f3c 0%, #050510 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            direction: ltr;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* -----------------------------------------------------------
           2. هيكل الجوال
           ----------------------------------------------------------- */
        .mobile-container {
            width: 375px; height: 812px;
            background: #050510;
            border-radius: 40px;
            border: 12px solid #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            position: relative;
            display: flex; flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(50px);
        }

        .notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 200px; height: 30px; background: #1a1a1a;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 10;
        }

        .status-bar { display: flex; justify-content: space-between; padding: 10px 30px; font-size: 14px; margin-top: 30px; z-index: 5; }

        /* -----------------------------------------------------------
           3. الهيدر والعنوان
           ----------------------------------------------------------- */
        .header { text-align: center; padding: 20px 0; z-index: 5; }
        .app-title-container { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .rocket-icon { font-size: 24px; }
        .app-title { font-size: 22px; font-weight: bold; letter-spacing: 1px; }
        .app-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }

        /* -----------------------------------------------------------
           4. منطقة الإدخال
           ----------------------------------------------------------- */
        .input-area { padding: 20px; z-index: 5; }
        .input-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; display: block; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .url-input { width: 100%; padding: 15px; padding-right: 110px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 15px; color: var(--text-main); font-size: 14px; }
        .url-input::placeholder { color: #555; }
        .paste-btn { position: absolute; right: 10px; background: var(--glass-bg); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--accent-gold); padding: 8px 15px; border-radius: 10px; font-size: 12px; cursor: pointer; transition: all 0.3s ease; }
        .paste-btn:hover { background: rgba(255, 255, 255, 0.1); }

        /* -----------------------------------------------------------
           5. زر التحميل
           ----------------------------------------------------------- */
        .download-btn { width: calc(100% - 40px); margin: 10px 20px 20px 20px; padding: 18px; background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple)); border: none; border-radius: 15px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(138, 79, 255, 0.3); transition: all 0.3s ease; z-index: 5; }
        .download-btn:hover { box-shadow: 0 15px 40px rgba(138, 79, 255, 0.5); transform: translateY(-2px); }
        .bolt-icon { color: var(--accent-gold); }

        /* -----------------------------------------------------------
           6. بطاقة الحالة الدائرية
           ----------------------------------------------------------- */
        .status-card-container { flex-grow: 1; padding: 20px; display: flex; justify-content: center; align-items: center; z-index: 5; display: none; }
        .status-card { width: 100%; padding: 30px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: 25px; border: var(--glass-border); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        
        .progress-container { position: relative; width: 150px; height: 150px; margin: 0 auto 20px auto; }
        .circular-progress { transform: rotate(-90deg); }
        .progress-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 8; }
        .progress-bar { fill: none; stroke: url(#gradient); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 0.5s ease; }
        
        .snap-icon-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(255, 255, 0, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .snap-ghost { width: 30px; height: 30px; }

        .download-meta { font-size: 18px; margin-bottom: 8px; }
        .download-description { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

        /* -----------------------------------------------------------
           7. الفوتر
           ----------------------------------------------------------- */
        .footer { text-align: center; padding: 20px; font-size: 11px; color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); z-index: 5; }
        .maher-credit { color: var(--accent-gold); font-weight: bold; }
        .nav-bar { display: flex; justify-content: space-around; padding: 15px 0; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border-top: var(--glass-border); z-index: 5; }
        .nav-icon { font-size: 20px; color: var(--text-secondary); cursor: pointer; }
        .nav-icon.active { color: var(--primary-blue); }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="notch"></div>
        <div class="status-bar"><span>9:41</span><span>📶 🔋 100%</span></div>

        <header class="header">
            <div class="app-title-container">
                <span class="rocket-icon">🚀</span>
                <h1 class="app-title">NEXUS PRO MAX</h1>
            </div>
            <p class="app-subtitle">V7 Enterprise | Verified RAW CDN</p>
        </header>

        <section class="input-area">
            <label class="input-label" for="snapUrl">Snapchat Video URL</label>
            <div class="input-wrapper">
                <input type="text" id="snapUrl" class="url-input" placeholder="Paste link here...">
                <button class="paste-btn" id="pasteBtn">📋 PASTE</button>
            </div>
        </section>

        <button class="download-btn" id="downloadBtn">
            <span class="bolt-icon">⚡</span>
            EXTRACT RAW VIDEO
        </button>

        <div class="status-card-container" id="statusCardContainer">
            <div class="status-card">
                <div class="progress-container">
                    <svg class="circular-progress" width="150" height="150" viewBox="0 0 150 150">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#3a8dff" />
                                <stop offset="100%" stop-color="#ffcf40" />
                            </linearGradient>
                        </defs>
                        <circle class="progress-bg" cx="75" cy="75" r="70"></circle>
                        <circle class="progress-bar" id="progressBar" cx="75" cy="75" r="70"></circle>
                    </svg>
                    <div class="snap-icon-container">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/c/c4/Snapchat_logo.svg/100px-Snapchat_logo.svg.png" alt="Snapchat" class="snap-ghost">
                    </div>
                </div>
                <p class="download-meta"><span id="currentSize">0</span> MB / <span id="totalSize">--</span> MB</p>
                <p class="download-description" id="statusDesc">Waiting for URL...</p>
            </div>
        </div>

        <footer class="footer">
            <p>© 2024 <span class="maher-credit">NEXUS GLOBAL</span></p>
            <p>Dedicated to <span class="maher-credit">MAHER</span> for Elite Engineering.</p>
        </footer>

        <nav class="nav-bar">
            <span class="nav-icon active">🏠</span>
            <span class="nav-icon">📚</span>
            <span class="nav-icon">🔍</span>
            <span class="nav-icon">⚙️</span>
        </nav>
    </div>

    <script>
        const pasteBtn = document.getElementById('pasteBtn');
        const urlInput = document.getElementById('snapUrl');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusCard = document.getElementById('statusCardContainer');
        const progressBar = document.getElementById('progressBar');
        const currentSizeEl = document.getElementById('currentSize');
        const totalSizeEl = document.getElementById('totalSize');
        const statusDesc = document.getElementById('statusDesc');

        const circumference = 440;

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                urlInput.value = text;
                pasteBtn.textContent = "✅ PASTED";
                setTimeout(() => pasteBtn.textContent = "📋 PASTE", 2000);
            } catch (err) {
                alert('الرجاء لصق الرابط يدوياً (متصفحك يمنع القراءة المباشرة من الحافظة).');
            }
        });

        downloadBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url || !url.includes('snapchat.com')) {
                alert('⚠️ يرجى إدخال رابط سناب شات صحيح.');
                return;
            }

            statusCard.style.display = 'flex';
            downloadBtn.disabled = true;
            downloadBtn.style.opacity = "0.5";
            downloadBtn.textContent = "EXTRACTING RAW VIDEO...";
            statusDesc.textContent = "Connecting to NEXUS API...";
            progressBar.style.strokeDashoffset = circumference; 

            let fakeProgress = 0;
            const loaderInterval = setInterval(() => {
                if (fakeProgress < 85) fakeProgress += Math.random() * 5;
                currentSizeEl.textContent = "Wait";
                totalSizeEl.textContent = "...";
                progressBar.style.strokeDashoffset = circumference - ((fakeProgress / 100) * circumference);
            }, 300);

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();
                clearInterval(loaderInterval);

                if (data.success) {
                    progressBar.style.strokeDashoffset = 0; 
                    currentSizeEl.textContent = data.size_mb;
                    totalSizeEl.textContent = data.size_mb;
                    statusDesc.textContent = `✅ Success!\nMethod: ${data.method}`;
                    
                    downloadBtn.innerHTML = "<span class='bolt-icon'>📥</span> SAVE TO DEVICE";
                    downloadBtn.style.opacity = "1";
                    downloadBtn.disabled = false;
                    
                    downloadBtn.onclick = () => {
                        window.location.href = data.video_url;
                    };

                } else {
                    progressBar.style.strokeDashoffset = circumference;
                    currentSizeEl.textContent = "0";
                    totalSizeEl.textContent = "--";
                    statusDesc.textContent = `❌ Error: ${data.error}`;
                    downloadBtn.innerHTML = "<span class='bolt-icon'>⚡</span> TRY ANOTHER LINK";
                    downloadBtn.style.opacity = "1";
                    downloadBtn.disabled = false;
                    downloadBtn.onclick = () => location.reload();
                }

            } catch (error) {
                clearInterval(loaderInterval);
                statusDesc.textContent = "❌ Server timeout or network error.";
                downloadBtn.innerHTML = "<span class='bolt-icon'>⚡</span> TRY AGAIN";
                downloadBtn.style.opacity = "1";
                downloadBtn.disabled = false;
                downloadBtn.onclick = () => location.reload();
            }
        });
    </script>
</body>
</html>
